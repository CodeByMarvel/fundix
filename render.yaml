services:
  - type: web
    name: fundix-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
